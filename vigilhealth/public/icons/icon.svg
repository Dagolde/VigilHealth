  <!-- Shield shape -->
  <path d="M256 96 L368 140 L368 256 C368 318 320 368 256 400 C192 368 144 318 144 256 L144 140 Z"
        fill="white" opacity="0.15"/>
  <path d="M256 108 L356 148 L356 256 C356 312 312 358 256 388 C200 358 156 312 156 256 L156 148 Z"
        fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/>

  <!-- Heart pulse / ECG line inside shield -->
